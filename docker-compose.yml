# ==============================================================================
# NEXUS — THE LAST CHANCE (Cyber Quest)
# Complete System Docker Compose Configuration (client + server + mongodb)
#
# Start complete system:
#   docker compose up --build
#
# Reset database & persistent volume:
#   docker compose down -v
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MONGODB DATABASE (with Persistent Volume + Host Port for MongoDB Compass)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: nexus-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. SERVER (Node.js + Express + Socket.IO + Mongoose Authoritative Engine)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-production}
    container_name: nexus-server
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5050}
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongodb:27017/nexus}
      TESTING: ${TESTING:-false}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      SOCKET_URL: ${SOCKET_URL:-http://localhost:5050}
      CLOUDFLARE_URL: ${CLOUDFLARE_URL:-}
      CLOUDFLARE_CLIENT_URL: ${CLOUDFLARE_CLIENT_URL:-}
      CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL:-}
      CLOUDFLARE_SOCKET_URL: ${CLOUDFLARE_SOCKET_URL:-}
      JWT_SECRET: ${JWT_SECRET:-nexus_core_authoritative_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      STARTING_CREDITS: ${STARTING_CREDITS:-1250}
      CREDIT_COST_HINT: ${CREDIT_COST_HINT:-100}
      CREDIT_COST_EXTRA_TIME: ${CREDIT_COST_EXTRA_TIME:-150}
      CREDIT_REATTEMPT_MULTIPLIER: ${CREDIT_REATTEMPT_MULTIPLIER:-1.25}
      SYSTEM_DESIGNATION: ${SYSTEM_DESIGNATION:-NEXUS-CORE-01}
      SYSTEM_VERSION: ${SYSTEM_VERSION:-1.0.0-NEXUS-FINAL}
    volumes:
      - ./server/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-5050}/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. CLIENT (React + Vite + Tailwind CSS + Framer Motion + GSAP)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-production}
      args:
        TESTING: ${TESTING:-false}
        CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
        SOCKET_URL: ${SOCKET_URL:-http://localhost:5050}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5050}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5050}
        CLOUDFLARE_URL: ${CLOUDFLARE_URL:-}
        CLOUDFLARE_CLIENT_URL: ${CLOUDFLARE_CLIENT_URL:-}
        CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL:-}
        CLOUDFLARE_SOCKET_URL: ${CLOUDFLARE_SOCKET_URL:-}
        VITE_CLOUDFLARE_URL: ${VITE_CLOUDFLARE_URL:-}
    container_name: nexus-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      TESTING: ${TESTING:-false}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      SOCKET_URL: ${SOCKET_URL:-http://localhost:5050}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5050}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5050}
      CLOUDFLARE_URL: ${CLOUDFLARE_URL:-}
      CLOUDFLARE_CLIENT_URL: ${CLOUDFLARE_CLIENT_URL:-}
      CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL:-}
      CLOUDFLARE_SOCKET_URL: ${CLOUDFLARE_SOCKET_URL:-}
      VITE_CLOUDFLARE_URL: ${VITE_CLOUDFLARE_URL:-}
      DOCKER_API_TARGET: http://server:${PORT:-5050}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - nexus-network

volumes:
  mongodb_data:
    name: nexus_mongodb_data
    driver: local

networks:
  nexus-network:
    name: nexus_arena_network
    driver: bridge
